# Weekly incremental refresh: the scheduler half of "incremental by construction".
# Any missed weeks are caught up automatically because runs diff against the
# Iceberg manifest and process only missing (date, mgrs_tile) partitions.
name: refresh
on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ hashFiles('src/session.py') }}
      - name: setup
        run: make setup
      - name: data
        run: make data
      - name: incremental pipeline (demo scope, current season)
        run: make pipeline
      - name: rebuild tiles and site data
        run: |
          source scripts/java_env.sh
          .venv/bin/python src/04_publish.py
          bash scripts/make_tiles.sh
      - name: commit refreshed tiles
        run: |
          git config user.name "refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/fields.pmtiles web/county.geojson web/season.json
          git diff --cached --quiet || git commit -m "chore: weekly incremental refresh"
          git push
