# Cluster-level Spark defaults for the s2-field-ndvi image.
# App-level config -- Iceberg catalog/warehouse, Sedona SQL extensions, driver
# memory, shuffle partitions -- stays in src/session.py, which is the sole
# source of truth for that; this file holds only settings that belong to the
# cluster the job runs on, not the application.
#
# NOTE: this file only takes effect when spark-submit runs inside the image
# directly (no k8s in the loop). On kind/EKS, Spark on Kubernetes mounts a
# generated ConfigMap over SPARK_CONF_DIR in the driver/executor pods,
# shadowing this file -- see docker/Dockerfile's COPY comment. The two s3a
# keys below are duplicated at the SparkConf-builder level in src/session.py,
# which is what actually applies on k8s.

# anonymous access to the public Sentinel-2 / Landsat / DEM buckets on s3a
spark.hadoop.fs.s3a.aws.credentials.provider    org.apache.hadoop.fs.s3a.AnonymousAWSCredentialsProvider
spark.hadoop.fs.s3a.experimental.input.fadvise  random

# no event-log server in kind/EKS; don't try to write history to a path nobody serves
spark.eventLog.enabled  false

# spark.jars / spark.jars.packages are intentionally UNSET here. The five pinned
# jars are baked into $SPARK_HOME/jars by docker/Dockerfile and Spark loads
# everything in that directory onto the classpath automatically -- setting
# spark.jars.packages would re-trigger ivy resolution at job start (forbidden,
# see src/session.py's S2FN_JARS_BAKED gate), and setting spark.jars to the same
# jars already on the classpath would be a no-op at best.
